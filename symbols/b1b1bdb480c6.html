<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="source-wiki-viewer-version" content="9"><title>link</title><link rel="stylesheet" href="../styles.css"></head><body><h1>Multiple definitions: <code>link</code></h1><ul><li><a href="../source/src/port/win32link.c.html#L17" target="source-view">src/port/win32link.c:17 (function)</a></li><li><a href="../source/src/timezone/zic.c.html#L298" target="source-view">src/timezone/zic.c:298 (struct)</a></li></ul><script>
(function() {
  function notifyParent() {
    if (parent === window) return;
    parent.postMessage({type: "frame-location", frame: window.name || "", href: window.location.href}, "*");
  }
  document.addEventListener("click", function(event) {
    const link = event.target.closest("a[data-panel]");
    if (!link || parent === window) return;
    parent.postMessage({type: "source-link", panel: link.dataset.panel}, "*");
  });
  window.addEventListener("load", notifyParent);
  window.addEventListener("hashchange", notifyParent);
})();
</script></body></html>
