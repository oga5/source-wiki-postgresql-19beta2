<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="source-wiki-viewer-version" content="9"><title>stop_postmaster</title><link rel="stylesheet" href="../styles.css"></head><body><h1>Multiple definitions: <code>stop_postmaster</code></h1><ul><li><a href="../source/src/bin/pg_upgrade/server.c.html#L293" target="source-view">src/bin/pg_upgrade/server.c:293 (function)</a></li><li><a href="../source/src/test/regress/pg_regress.c.html#L443" target="source-view">src/test/regress/pg_regress.c:443 (function)</a></li></ul><script>
(function() {
  function notifyParent() {
    if (parent === window) return;
    parent.postMessage({type: "frame-location", frame: window.name || "", href: window.location.href}, "*");
  }
  document.addEventListener("click", function(event) {
    const link = event.target.closest("a[data-panel]");
    if (!link || parent === window) return;
    parent.postMessage({type: "source-link", panel: link.dataset.panel}, "*");
  });
  window.addEventListener("load", notifyParent);
  window.addEventListener("hashchange", notifyParent);
})();
</script></body></html>
