<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="source-wiki-viewer-version" content="10"><title>Related: contrib/pageinspect/pageinspect.h</title><link rel="stylesheet" href="../../../styles.css"></head><body><h1>Related pages</h1><p>contrib/pageinspect/pageinspect.h</p><ul><li><a href="../../../wiki/symbols/contrib__pageinspect__pageinspect_h__pageinspect_version.html" target="wiki-view">enum: pageinspect_version</a></li><li><a href="../../../source/src/include/storage/bufpage.h.html" target="source-view">Include: storage/bufpage.h</a></li></ul><script>
(function() {
  function notifyParent() {
    if (parent === window) return;
    parent.postMessage({type: "frame-location", frame: window.name || "", href: window.location.href}, "*");
  }
  document.addEventListener("click", function(event) {
    const link = event.target.closest("a[data-panel]");
    if (!link || parent === window) return;
    parent.postMessage({type: "source-link", panel: link.dataset.panel}, "*");
  });
  window.addEventListener("load", notifyParent);
  window.addEventListener("hashchange", notifyParent);
})();
</script></body></html>
